.sec{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--tx3);margin-bottom:10px}

.ichk.on{background:var(--coral);border-color:var(--coral)}
.acc{padding:5px 10px;background:var(--bg2);border:.5px solid var(--bdr);border-radius:6px;font-size:15px;color:var(--tx);min-width:36px;text-align:center}
.sr{display:flex;justify-content:center;gap:24px;margin-top:1.25rem}
.si{display:flex;align-items:center;gap:5px;font-size:13px}
.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 20px;border-radius:20px;font-size:13px;font-weight:500;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;white-space:nowrap}
.toast.show{opacity:1}

.dot{width:7px;height:7px;border-radius:50%;background:var(--coral);display:inline-block;animation:pulse 1s infinite}
.seg-bar{height:6px;border-radius:3px;overflow:hidden;display:flex;margin-top:6px}
.seg-green{background:var(--green);height:100%}
.seg-amber{background:var(--amber);height:100%}
.seg-gray{background:var(--bg3);height:100%;flex:1}
.stat-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:3px;flex-shrink:0}

function showFeedback(ok,inp,responseTime){
  const fb=document.getElementById("fbbox"),lbl=document.getElementById("fblbl"),ans=document.getElementById("fbans"),typed=document.getElementById("fbtyped"),pronote=document.getElementById("pronote");
  const allAnswers=[curAns,...curAlts].join(" / ");
  fb.style.display="block";

    fb.style.background="var(--ok-bg)";fb.style.border=".5px solid var(--ok-tx)";lbl.style.color="var(--ok-tx)";
    lbl.textContent=responseTime/1000<4?"Correct! ⚡ Fast!":"Correct! ✓";typed.style.display="none";if(pronote)pronote.style.display="none";
  }else if(ok===false){
    fb.style.background="var(--err-bg)";fb.style.border=".5px solid var(--err-tx)";lbl.style.color="var(--err-tx)";
    const sim=similarity(inp,curAns);

    typed.textContent="You wrote: "+inp;typed.style.display="block";if(pronote)pronote.style.display="none";

    <div class="mcard"><div id="endw" style="font-size:22px;font-weight:500;color:var(--err-tx)">0</div><div style="font-size:11px;color:var(--tx2)">Incorrect</div></div>
    <div class="mcard"><div id="endp" style="font-size:22px;font-weight:500">0</div><div style="font-size:11px;color:var(--tx2)">Skipped</div></div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
    <button class="btn-s" onclick="showScreen('home')">Home</button>
    <button class="btn-p" onclick="if(lastCfg){sessionMode=lastCfg.mode;selLevels=lastCfg.lvs;selTenses=lastCfg.ts;}goSession()">Again</button>
  </div>
</div>
`;
document.addEventListener("keydown",e=>{if(document.activeElement===document.getElementById("ans")&&e.key==="Enter"){submitted?nextCard():checkAns();}});
loadData();buildAccentBar();updateHomeStats();showScreen("home");
</script>
</body>
</html>
