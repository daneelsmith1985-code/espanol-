  --tx:#F0F0FC;--tx2:#8080A8;--tx3:#4A4A6A;

  --glass:rgba(255,255,255,0.04);
  --ok-bg:rgba(74,222,128,0.12);--ok-tx:#4ADE80;
  --err-bg:rgba(255,82,82,0.12);--err-tx:#FF7070;
  --r:16px;--rs:10px;
}
body[data-theme="light"]{
  --bg:#F5F4F2;--bg2:#ECEAE6;--bg3:#E2E0DA;--bg4:#D8D5CE;
  --tx:#1A1A2E;--tx2:#5A5A7A;--tx3:#9A9AB0;
  --bdr:rgba(0,0,0,0.08);--bdr2:rgba(0,0,0,0.15);
  --glass:rgba(255,255,255,0.6);
  --ok-bg:#EAF7EE;--ok-tx:#2E7D32;
  --err-bg:#FFEBEE;--err-tx:#C62828;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{background:var(--bg);color:var(--tx);font-family:'Inter',-apple-system,system-ui,sans-serif;font-size:16px;line-height:1.5;min-height:100vh;transition:background .3s,color .3s}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 10%,rgba(255,95,61,0.07) 0%,transparent 55%),radial-gradient(ellipse at 80% 90%,rgba(124,111,255,0.07) 0%,transparent 55%);pointer-events:none;z-index:0}
#app{max-width:420px;margin:0 auto;padding:1.25rem 1rem 2rem;position:relative;z-index:1}
button{font-family:inherit;cursor:pointer}input{font-family:inherit}
.glass2{background:var(--bg2);border:.5px solid var(--bdr2);border-radius:var(--r)}
.btn-p{background:linear-gradient(135deg,var(--coral),#FF3D6B);color:#fff;border:none;border-radius:var(--r);padding:.9rem 1rem;font-size:14px;font-weight:600;width:100%;letter-spacing:.02em;box-shadow:0 4px 20px rgba(255,95,61,0.3);transition:opacity .15s,transform .15s}
.btn-p:active{opacity:.85;transform:scale(.98)}
.btn-p:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
.btn-s{background:var(--glass);color:var(--tx);border:.5px solid var(--bdr2);border-radius:var(--r);padding:.875rem 1rem;font-size:14px;font-weight:500;width:100%;backdrop-filter:blur(10px);transition:background .15s}
.btn-s:active{background:var(--bg3)}
.inp{width:100%;padding:.875rem 1rem;border:.5px solid var(--bdr2);border-radius:var(--rs);background:var(--bg2);color:var(--tx);font-size:16px;outline:none;font-family:'Inter',inherit;transition:border-color .2s,box-shadow .2s}
.inp:focus{border-color:var(--coral);box-shadow:0 0 0 3px rgba(255,95,61,0.15)}
.pill{font-size:11px;font-weight:700;letter-spacing:.07em;padding:4px 10px;border-radius:20px;text-transform:uppercase;display:inline-block}
.sec{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);margin-bottom:12px}
.pbar{height:3px;border-radius:2px;background:var(--bg3);overflow:hidden}
.pfill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--coral),var(--gold));transition:width .4s cubic-bezier(.4,0,.2,1)}
.seg-bar{height:5px;border-radius:3px;overflow:hidden;display:flex;margin-top:6px}
.seg-g{background:var(--green);height:100%}
.seg-a{background:var(--amber);height:100%}
.seg-e{background:var(--bg3);height:100%;flex:1}
.sdot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:4px;flex-shrink:0}
.flip-wrap{perspective:1200px;margin-bottom:1rem}
.flip-card{position:relative;width:100%;transition:transform .55s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d}
.flip-card.flipped{transform:rotateY(180deg)}
.flip-face{backface-visibility:hidden;-webkit-backface-visibility:hidden;width:100%;min-height:168px}
.flip-back{position:absolute;top:0;left:0;right:0;min-height:168px;transform:rotateY(180deg);backface-visibility:hidden;-webkit-backface-visibility:hidden}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.06)}70%{transform:scale(.97)}100%{transform:scale(1)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes sparkle{0%{opacity:0;transform:scale(0) rotate(0deg)}50%{opacity:1;transform:scale(1.2) rotate(180deg)}100%{opacity:0;transform:scale(0) rotate(360deg)}}
@keyframes slideIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}
.shake{animation:shake .4s ease}.pop{animation:pop .35s ease}.fade-up{animation:fadeUp .3s ease}.float{animation:float 3s ease-in-out infinite}
.dot{width:7px;height:7px;border-radius:50%;background:var(--coral);display:inline-block;animation:pulse 1s infinite}
.paz-bubble{background:var(--bg3);border:.5px solid var(--bdr2);border-radius:16px 16px 16px 4px;padding:10px 14px;font-size:13px;font-weight:500;color:var(--tx);max-width:200px;line-height:1.4}
.lbadge{width:44px;height:44px;border-radius:12px;background:var(--coral-l);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--coral-m);flex-shrink:0;border:.5px solid rgba(255,95,61,0.2)}
.ichk{width:22px;height:22px;border-radius:50%;border:.5px solid var(--bdr2);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.ichk.on{background:var(--coral);border-color:var(--coral)}
.acc{padding:6px 11px;background:var(--bg3);border:.5px solid var(--bdr2);border-radius:8px;font-size:15px;color:var(--tx);min-width:38px;text-align:center;font-family:'Inter',inherit}
.sr{display:flex;justify-content:center;gap:28px;margin-top:1.25rem}
.si{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:500}
.toast{position:fixed;bottom:calc(28px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:rgba(30,30,50,0.95);backdrop-filter:blur(20px);color:var(--tx);padding:11px 22px;border-radius:24px;font-size:13px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;white-space:nowrap;border:.5px solid var(--bdr2)}
.toast.show{opacity:1}
.sparkle-wrap{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;overflow:hidden;border-radius:var(--r)}
.sparkle{position:absolute;width:6px;height:6px;border-radius:50%;animation:sparkle .6s ease forwards}
.sc{display:none;animation:fadeUp .25s ease}.sc.active{display:block}
</style>

    if(ok===true){setTimeout(()=>{const sw=document.getElementById("sparkles");if(!sw)return;const colors=["#FFB347","#FF5F3D","#7C6FFF","#4ADE80","#FFD700"];for(let i=0;i<8;i++){const s=document.createElement("div");s.className="sparkle";s.style.cssText=`left:${10+Math.random()*80}%;top:${10+Math.random()*80}%;background:${colors[Math.floor(Math.random()*colors.length)]};animation-delay:${Math.random()*.4}s`;sw.appendChild(s);}},300);}

function buildLevelCards(){const el=document.getElementById("levelcards");el.innerHTML="";LEVELS.forEach(lv=>{const s=getLevelStats(lv),on=selLevels.includes(lv);const d=document.createElement("button");d.style.cssText=`display:flex;align-items:center;gap:12px;padding:.875rem 1rem;width:100%;background:${on?"var(--coral-l)":"var(--bg2)"};border:${on?".5px solid rgba(255,95,61,0.4)":".5px solid var(--bdr2)"};border-radius:var(--r);margin-bottom:10px;cursor:pointer;text-align:left;font-family:'Inter',inherit`;d.innerHTML=`<div class="lbadge" style="color:${on?"var(--coral)":"var(--coral-m)"}">${lv}</div><div style="flex:1;min-width:0"><div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-weight:600;font-size:14px;color:var(--tx)">${LN[lv]}</span><span style="font-size:11px;color:var(--tx3)">${s.fluent}/${s.total} fluent</span></div><div class="seg-bar" style="height:3px;margin-top:7px"><div class="seg-g" style="width:${s.total?Math.round(s.fluent/s.total*100):0}%"></div><div class="seg-a" style="width:${s.total?Math.round(s.practicing/s.total*100):0}%"></div><div class="seg-e"></div></div></div><div class="ichk${on?" on":""}"><svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="${on?"white":"transparent"}" stroke-width="3.5"><polyline points="20 6 9 17 4 12"/></svg></div>`;d.onclick=()=>{if(selLevels.includes(lv)){if(selLevels.length>1)selLevels=selLevels.filter(x=>x!==lv);}else selLevels.push(lv);buildLevelCards();};el.appendChild(d);});}
